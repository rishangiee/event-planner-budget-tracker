<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cavendia | Architecting Extraordinary Moments</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-green: #4a7c49;
            --header-bg: #b3cca2;
            --btn-bg: #a3bc96;
            --dark-pill: #588e58;
            --card-bg: #e1e7dc;
            --blue-border: #00a2ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* Main Container with the blue border from the image */
        .app-wrapper {
            width: 100%;
            max-width: 1200px;
            border: 4px solid var(--blue-border);
            border-radius: 4px;
            overflow: hidden;
            background-color: #fff;
        }

        /* --- Navigation --- */
        nav {
            background-color: var(--header-bg);
            padding: 10px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-group {
            display: flex;
            gap: 20px;
            align-items: center;
            flex: 1;
        }

        .nav-group.right { justify-content: flex-end; }

        nav a {
            text-decoration: none;
            color: #1a1a1a;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .active-pill {
            background-color: var(--dark-pill);
            color: white !important;
            padding: 6px 16px;
            border-radius: 20px;
        }

        .logo {
            font-family: 'Lalezar', cursive;
            font-size: 28px;
            color: var(--primary-green);
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0;
        }

        /* --- Hero Section --- */
        .hero {
            position: relative;
            height: 600px;
            background: url('https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&q=80&w=2000') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-card {
            background: var(--card-bg);
            padding: 60px 40px;
            border-radius: 50px;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .hero-card h1 {
            font-size: 32px;
            font-weight: 800;
            color: #000;
            margin-bottom: 15px;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .hero-card p {
            font-size: 16px;
            color: #333;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .btn-get-started {
            background-color: var(--btn-bg);
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-get-started:hover {
            background-color: var(--dark-pill);
            transform: translateY(-2px);
        }

        @media (max-width: 900px) {
            nav { flex-direction: column; gap: 10px; padding: 20px; }
            .nav-group { justify-content: center; }
            .hero-card { margin: 20px; width: 90%; }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <nav>
            <div class="nav-group">
                <a href="#" class="active-pill">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
            
            <div class="logo">
                <i class="fa-solid fa-ticket-simple"></i> CAVENDIA
            </div>
            
            <div class="nav-group right">
                <a href="#">Create Event</a>
                <a href="#">Login</a>
                <a href="#">Sign Up</a>
            </div>
        </nav>

        <section class="hero">
            <div class="hero-card">
                <h1>CAVENDIA : Architecting Extraordinary Moments</h1>
                <p>A bespoke event design collective crafting unforgettable celebrations</p>
                <button class="btn-get-started">
                    Get Started <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </section>
    </div>

</body>
</html>
