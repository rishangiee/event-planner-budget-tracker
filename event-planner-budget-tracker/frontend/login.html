<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cavendia - Portal</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-green: #4a7c49;
            --header-bg: #b3cca2;
            --button-bg: #a3bc96;
            --button-hover: #8fa882;
            --dark-bg: #2b2b2b;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark-bg); 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .app-container {
            width: 95%;
            max-width: 1100px;
            background-color: var(--white);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* --- Global Header --- */
        header {
            background-color: var(--header-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 40px;
        }

        .logo {
            font-family: 'Lalezar', cursive;
            font-size: 32px; 
            color: var(--primary-green);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links, .auth-links {
            display: flex;
            gap: 25px;
            align-items: center; 
        }

        .nav-links a, .auth-links a {
            text-decoration: none;
            color: #333;
            font-size: 11px; 
            font-weight: 800;
            text-transform: uppercase;
        }

        /* Highlighting the 'Active' button */
        .btn-active {
            background-color: #588e58;
            color: white !important;
            padding: 6px 16px;
            border-radius: 20px;
        }

        /* --- Layout --- */
        .main-content {
            display: flex;
            padding: 45px;
            gap: 45px;
            align-items: stretch;
        }

        .image-section {
            flex: 1.2;
        }

        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            border: 1px solid #ddd;
        }

        /* --- Unified Card Styling --- */
        .portal-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .portal-card {
            width: 100%;
            border: 1px solid #999;
            border-radius: 40px;
            padding: 45px 35px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .portal-card h2 {
            font-size: 24px;
            font-weight: 800;
            line-height: 1.2;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-top: -12px;
        }

        .notice-box {
            border: 1px solid #333;
            border-radius: 12px;
            padding: 18px;
            font-size: 13px;
            line-height: 1.5;
            color: #111;
            background-color: #f9fdf7;
        }

        .portal-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--button-bg);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .portal-btn:hover {
            background-color: var(--button-hover);
        }

        .forgot-link {
            font-size: 12px;
            color: #888;
            text-decoration: none;
            align-self: flex-end;
            margin-top: -10px;
            font-style: italic;
        }

        .footer-text {
            margin-top: 15px;
            font-size: 14px;
        }

        .footer-text strong {
            cursor: pointer;
            text-decoration: underline;
        }

        /* --- Form Styling --- */
        .role-selector {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .role-btn {
            flex: 1;
            padding: 12px 16px;
            background-color: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .role-btn:hover {
            border-color: var(--button-bg);
            background-color: #e8f5e8;
        }

        .role-btn.active {
            background-color: var(--button-bg);
            color: white;
            border-color: var(--button-bg);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-input {
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--button-bg);
            box-shadow: 0 0 5px rgba(163, 188, 150, 0.3);
        }

        .form-input::placeholder {
            color: #999;
        }

        .error-msg {
            color: #d32f2f;
            font-size: 12px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        .success-msg {
            background-color: #4caf50;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            text-align: center;
        }

        .success-msg.show {
            display: block;
        }

        .login-submit-btn {
            margin-top: 10px;
        }

        .login-submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 950px) {
            .main-content { flex-direction: column; padding: 25px; }
            header { padding: 15px; flex-wrap: wrap; justify-content: center; gap: 15px; }
            .logo { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
            
            <div class="logo">
                <i class="fa-solid fa-ticket-simple"></i> CAVENDIA
            </div>
            
            <div class="auth-links">
                <a href="#">Create Event</a>
                <a href="#" class="btn-active">Login</a> <a href="#">Sign Up</a>
            </div>
        </header>

        <div class="main-content">
            <div class="image-section">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuLlyjfu_htb-qkhMP0V7JPy5_saZHCfWW3N6Qy50VjmHV6Pun" alt="Matcha Celebration Cakes">
            </div>

            <div class="portal-section">
                <div class="portal-card">
                    <h2>Welcome to Event Planner Calendar</h2>
                    <p class="subtitle">Login to manage your Account</p>

                    <div class="notice-box">
                        <i class="fa-solid fa-circle-info"></i> <strong>Notice:</strong><br>
                        Planning and budgeting for upcoming events is actively supported.
                    </div>

                    <!-- Role Selection -->
                    <div class="role-selector" id="roleSelector">
                        <button type="button" class="role-btn" data-role="client">
                            <i class="fa-solid fa-user"></i> Client Login
                        </button>
                        <button type="button" class="role-btn" data-role="vendor">
                            <i class="fa-solid fa-briefcase"></i> Vendor Login
                        </button>
                    </div>

                    <!-- Login Form -->
                    <form class="login-form" id="loginForm" method="POST">
                        <input type="hidden" id="userRole" name="userRole" value="">
                        
                        <div class="form-group">
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="Enter your email" 
                                required
                                class="form-input"
                            >
                            <span class="error-msg" id="emailError"></span>
                        </div>

                        <div class="form-group">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Enter your password" 
                                required
                                class="form-input"
                            >
                            <span class="error-msg" id="passwordError"></span>
                        </div>

                        <button type="submit" class="portal-btn login-submit-btn" id="loginBtn">
                            Login
                        </button>

                        <a href="#" class="forgot-link">Forgot Password?</a>

                        <p class="footer-text">Don't have an account? <strong id="signupLink">Sign up</strong></p>

                        <div id="successMsg" class="success-msg"></div>
                        <div id="errorMsg" class="error-msg"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = 'http://localhost:5000'; // Flask backend URL

        // DOM Elements
        const roleSelector = document.getElementById('roleSelector');
        const roleBtns = document.querySelectorAll('.role-btn');
        const loginForm = document.getElementById('loginForm');
        const userRoleInput = document.getElementById('userRole');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const successMsg = document.getElementById('successMsg');
        const errorMsg = document.getElementById('errorMsg');
        const signupLink = document.getElementById('signupLink');

        let selectedRole = '';

        // Role Selection Handler
        roleBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove active class from all buttons
                roleBtns.forEach(b => b.classList.remove('active'));
                // Add active class to clicked button
                this.classList.add('active');
                selectedRole = this.dataset.role;
                userRoleInput.value = selectedRole;
                
                // Clear previous messages
                clearMessages();
                console.log(`Selected role: ${selectedRole}`);
            });
        });

        // Email Validation
        emailInput.addEventListener('blur', function() {
            if (!validateEmail(this.value)) {
                emailError.textContent = 'Please enter a valid email address';
                emailError.classList.add('show');
            } else {
                emailError.classList.remove('show');
            }
        });

        // Password Validation
        passwordInput.addEventListener('blur', function() {
            if (this.value.length < 6) {
                passwordError.textContent = 'Password must be at least 6 characters';
                passwordError.classList.add('show');
            } else {
                passwordError.classList.remove('show');
            }
        });

        // Form Submission
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Validation
            if (!selectedRole) {
                errorMsg.textContent = 'Please select a login type (Client or Vendor)';
                errorMsg.classList.add('show');
                return;
            }

            if (!validateEmail(emailInput.value)) {
                emailError.textContent = 'Please enter a valid email address';
                emailError.classList.add('show');
                return;
            }

            if (passwordInput.value.length < 6) {
                passwordError.textContent = 'Password must be at least 6 characters';
                passwordError.classList.add('show');
                return;
            }

            // Clear previous messages
            clearMessages();

            // Disable button during submission
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                // Make API call to login endpoint
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: emailInput.value,
                        password: passwordInput.value,
                        role: selectedRole
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Success
                    successMsg.textContent = `Welcome! Redirecting to ${selectedRole === 'client' ? 'Client' : 'Vendor'} Dashboard...`;
                    successMsg.classList.add('show');

                    // Store token/session info (optional)
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userRole', selectedRole);
                    localStorage.setItem('userEmail', emailInput.value);

                    // Redirect after 2 seconds
                    setTimeout(() => {
                        const dashboardUrl = selectedRole === 'client' ? 'events.html' : 'budget.html';
                        window.location.href = dashboardUrl;
                    }, 2000);
                } else {
                    // Handle error response
                    errorMsg.textContent = data.message || 'Login failed. Please check your credentials and try again.';
                    errorMsg.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            } catch (error) {
                // Network or parsing error
                console.error('Login error:', error);
                errorMsg.textContent = 'Connection error. Please ensure the server is running (http://localhost:5000) and try again.';
                errorMsg.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });

        // Utility Functions
        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function clearMessages() {
            emailError.classList.remove('show');
            passwordError.classList.remove('show');
            successMsg.classList.remove('show');
            errorMsg.classList.remove('show');
        }

        // Sign up link handler
        signupLink.addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = 'signup.html';
        });
    </script>

</body>
</html>
