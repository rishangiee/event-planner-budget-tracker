<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cavendia - Sign Up</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2b2b2b; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
        }

        .app-container {
            width: 95%;
            max-width: 1100px;
            background-color: #e8ede3;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        header {
            background-color: #b5d3af;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 30px;
            width: 100%;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            flex: 1;
        }

        .nav-links a {
            text-decoration: none;
            color: #1a1a1a;
            font-size: 12px; 
            font-weight: 400; /* Normal weight */
            text-transform: uppercase;
        }

        .logo {
            font-family: 'Lalezar', cursive;
            font-size: 38px;
            color: #4a7c49;
            display: flex;
            align-items: center;
            gap: 12px;
            line-height: 1;
            flex: 0;
        }

        .auth-links {
            display: flex;
            gap: 20px;
            align-items: center;
            flex: 1; 
            justify-content: flex-end;
        }

        .auth-links a {
            text-decoration: none;
            color: #1a1a1a;
            font-size: 12px; 
            font-weight: 400;
            text-transform: uppercase;
        }

        .signup-btn-nav {
            background-color: white;
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: 400 !important; 
        }

        .main-content {
            display: flex;
            padding: 35px;
            gap: 40px;
            flex-wrap: wrap;
        }

        .image-section {
            flex: 1.1;
            min-width: 350px;
        }

        .image-section img {
            width: 100%;
            height: 100%;
            min-height: 500px;
            object-fit: cover;
            border: 1px solid #999;
            border-radius: 20px;
            display: block;
        }

        .form-section {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 900;
            color: #000;
        }

        .form-group {
            margin-bottom: 12px;
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #999;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 18px;
            color: #bbb;
            font-size: 14px;
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            background-color: #9cb994;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 15px;
        }

        .switch-prompt {
            text-align: center;
            font-size: 14px;
            margin-top: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0 20px;
            font-size: 13px;
            color: #555;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #999;
            margin: 0 15px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .fb { background: #1877f2; color: white; }
        .google-btn { background: #ffffff; border: 1px solid #ddd; }
        .google-btn img { width: 26px; height: 26px; }
        .ig { background: linear-gradient(45deg, #f09433, #bc1888); color: white; }

        @media (max-width: 950px) {
            header { flex-direction: column; gap: 10px; padding: 20px; }
            .nav-links, .auth-links { justify-content: center; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Events</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
            
            <div class="logo">
                <i class="fa-solid fa-ticket"></i> CAVENDIA
            </div>
            
            <div class="auth-links">
                <a href="#">Create Event</a>
                <a href="#">Login</a>
                <a href="#" class="signup-btn-nav">Sign Up</a>
            </div>
        </header>

        <div class="main-content">
            <div class="image-section">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuLlyjfu_htb-qkhMP0V7JPy5_saZHCfWW3N6Qy50VjmHV6Pun" alt="Matcha Cakes">
            </div>

            <div class="form-section">
                <h2>Create Your Account</h2>
                
                <form id="signupForm">
                    <div class="form-group"><input type="text" placeholder="Full Name" required></div>
                    <div class="form-group"><input type="text" placeholder="Email or Username" required></div>
                    <div class="form-group">
                        <input type="password" placeholder="Password" required>
                        <i class="fa-regular fa-eye-slash password-toggle"></i>
                    </div>
                    <div class="form-group">
                        <input type="password" placeholder="Re-type Password" required>
                        <i class="fa-regular fa-eye-slash password-toggle"></i>
                    </div>
                    <button type="submit" class="action-btn">Sign Up</button>
                </form>

                <p class="switch-prompt">Already have an account? <strong>LOGIN</strong></p>

                <div class="divider">Or sign up with</div>

                <div class="social-icons">
                    <a href="#" class="icon fb"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="icon google-btn"><img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="G"></a>
                    <a href="#" class="icon ig"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
