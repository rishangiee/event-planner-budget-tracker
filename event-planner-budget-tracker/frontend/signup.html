<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cavendia - Create Your Account</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-green: #4a7c49;
            --header-bg: #b3cca2;
            --btn-bg: #a3bc96;
            --dark-btn: #588e58;
            --bg-sage: #e1e7dc;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .app-container {
            width: 95%;
            max-width: 1050px;
            background-color: var(--bg-sage);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            border: 3px solid #00a2ff; 
        }

        /* --- Header Section --- */
        header {
            background-color: var(--header-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 40px;
        }

        .logo {
            font-family: 'Lalezar', cursive;
            font-size: 30px; 
            color: var(--primary-green);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links, .auth-links {
            display: flex;
            gap: 25px;
            align-items: center; 
        }

        .nav-links a, .auth-links a {
            text-decoration: none;
            color: #1a1a1a;
            font-size: 10px; 
            font-weight: 800;
            text-transform: uppercase;
        }

        .active-pill {
            background-color: var(--dark-btn);
            color: white !important;
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* --- Content Layout --- */
        .main-content {
            display: flex;
            padding: 35px;
            gap: 40px;
            align-items: center;
        }

        .image-side {
            flex: 1;
        }

        .image-side img {
            width: 100%;
            border-radius: 20px;
            border: 1px solid #777;
            display: block;
        }

        /* --- Sign Up Form --- */
        .form-side {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .signup-card {
            background: var(--white);
            width: 100%;
            max-width: 420px;
            border: 1px solid #000;
            border-radius: 45px;
            padding: 40px 30px;
            text-align: center;
        }

        .signup-card h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 25px;
            color: #000;
        }

        .input-box {
            margin-bottom: 12px;
            position: relative;
        }

        .input-box input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #333;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            color: #555;
        }

        .input-box i {
            position: absolute;
            right: 18px;
            top: 16px;
            color: #999;
            font-size: 14px;
        }

        .btn-signup {
            width: 100%;
            padding: 15px;
            background-color: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .login-footer {
            margin-top: 15px;
            font-size: 14px;
            color: #1a1a1a;
        }

        /* --- Social Login Icons --- */
        .divider-container {
            display: flex;
            align-items: center;
            width: 80%;
            margin: 25px 0 15px 0;
            font-size: 12px;
            color: #333;
        }

        .divider-container::before, .divider-container::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #000;
            margin: 0 15px;
        }

        .social-row {
            display: flex;
            gap: 30px;
            margin-top: 10px;
            align-items: center;
        }

        .social-row img {
            width: 40px; /* Standardized sizing for SVGs */
            height: 40px;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
        }

        .social-row img:hover {
            transform: scale(1.15);
        }

        @media (max-width: 900px) {
            .main-content { flex-direction: column; }
            header { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
            
            <div class="logo">
                <i class="fa-solid fa-ticket-simple"></i> CAVENDIA
            </div>
            
            <div class="auth-links">
                <a href="events.html">Create Event</a>
                <a href="login.html">Login</a>
                <a href="signup.html" class="active-pill">Sign Up</a>
            </div>
        </header>

        <div class="main-content">
            <div class="image-side">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuLlyjfu_htb-qkhMP0V7JPy5_saZHCfWW3N6Qy50VjmHV6Pun" alt="Celebration Cakes">
            </div>

            <div class="form-side">
                <div class="signup-card">
                    <h2>Create Your Account</h2>
                    
                    <form id="signupForm">
                        <div class="input-box">
                            <input type="text" id="fullName" placeholder="Full Name" required>
                        </div>
                        <div class="input-box">
                            <input type="email" id="email" placeholder="Email Address" required>
                        </div>
                        <div class="input-box">
                            <input type="password" id="password" placeholder="Password" required>
                            <i class="fa-regular fa-eye-slash toggle-password" data-target="password" style="cursor: pointer;"></i>
                        </div>
                        <div class="input-box">
                            <input type="password" id="confirmPassword" placeholder="Re-type Password" required>
                            <i class="fa-regular fa-eye-slash toggle-password" data-target="confirmPassword" style="cursor: pointer;"></i>
                        </div>

                        <div id="errorMessage" style="color: #d32f2f; font-size: 12px; margin-bottom: 10px; display: none;"></div>
                        <div id="successMessage" style="color: #388e3c; font-size: 12px; margin-bottom: 10px; display: none;"></div>

                        <button type="submit" class="btn-signup">Sign Up</button>
                    </form>

                    <p class="login-footer">Already have an account? <a href="login.html" style="text-decoration: none; color: var(--primary-green);"><strong>LOGIN</strong></a></p>
                </div>

                <div class="divider-container">Or login with</div>

                <div class="social-row">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" alt="Facebook" style="opacity: 0.5; cursor: not-allowed;" title="Coming soon">
                    
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" style="opacity: 0.5; cursor: not-allowed;" title="Coming soon">
                    
                    <img src="https://upload.wikimedia.org/wikipedia/commons/9/95/Instagram_logo_2022.svg" alt="Instagram" style="opacity: 0.5; cursor: not-allowed;" title="Coming soon">
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';

        // Toggle password visibility
        document.querySelectorAll('.toggle-password').forEach(icon => {
            icon.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const inputField = document.getElementById(targetId);
                
                if (inputField.type === 'password') {
                    inputField.type = 'text';
                    this.classList.remove('fa-eye-slash');
                    this.classList.add('fa-eye');
                } else {
                    inputField.type = 'password';
                    this.classList.remove('fa-eye');
                    this.classList.add('fa-eye-slash');
                }
            });
        });

        // Handle form submission
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            // Clear previous messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // Validation
            if (!fullName) {
                showError('Please enter your full name');
                return;
            }
            
            if (!email) {
                showError('Please enter your email address');
                return;
            }
            
            if (!isValidEmail(email)) {
                showError('Please enter a valid email address');
                return;
            }
            
            if (password.length < 6) {
                showError('Password must be at least 6 characters long');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }
            
            // Disable button during submission
            const submitBtn = document.querySelector('.btn-signup');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';
            
            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        full_name: fullName,
                        email: email,
                        password: password,
                        role: 'user'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showSuccess('Account created successfully! Redirecting to login...');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showError(data.message || 'Registration failed. Please try again.');
                }
            } catch (error) {
                showError('Network error. Please check your connection and try again.');
                console.error('Registration error:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign Up';
            }
        });
        
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }
    </script>

</body>
</html>
