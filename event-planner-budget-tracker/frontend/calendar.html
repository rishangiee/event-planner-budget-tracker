<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - Event Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-calendar-alt me-2"></i>Event Planner
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="index.html"><i class="fas fa-home me-1"></i>Dashboard</a>
                    <a class="nav-link active" href="calendar.html"><i class="fas fa-calendar me-1"></i>Calendar</a>
                    <a class="nav-link" href="budget.html"><i class="fas fa-wallet me-1"></i>Budget</a>
                    <a class="nav-link" href="index.html#events"><i class="fas fa-calendar-day me-1"></i>Events</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4 min-vh-100">
        <div class="row">
            <!-- Calendar Sidebar -->
            <div class="col-xl-3 col-lg-4 mb-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-primary text-white py-3">
                        <h5 class="mb-0">
                            <i class="fas fa-list me-2"></i>Upcoming Events
                        </h5>
                    </div>
                    <div class="card-body p-0">
                        <div id="eventList" class="list-group list-group-flush">
                            <!-- Events will be loaded here -->
                        </div>
                    </div>
                    <div class="card-footer bg-light border-0">
                        <button class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#eventModal">
                            <i class="fas fa-plus me-2"></i>Add New Event
                        </button>
                    </div>
                </div>
            </div>

            <!-- Main Calendar -->
            <div class="col-xl-9 col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="h3 mb-0 fw-bold text-dark">
                        <i class="fas fa-calendar-week text-primary me-2"></i>Event Calendar
                    </h2>
                    <div class="btn-group" role="group">
                        <button id="dayGridMonth" class="btn btn-outline-primary active" data-view="dayGridMonth">
                            <i class="fas fa-calendar-month me-1"></i>Month
                        </button>
                        <button id="timeGridWeek" class="btn btn-outline-primary" data-view="timeGridWeek">
                            <i class="fas fa-calendar-week me-1"></i>Week
                        </button>
                        <button id="timeGridDay" class="btn btn-outline-primary" data-view="timeGridDay">
                            <i class="fas fa-calendar-day me-1"></i>Day
                        </button>
                        <button id="listWeek" class="btn btn-outline-primary" data-view="listWeek">
                            <i class="fas fa-list me-1"></i>List
                        </button>
                    </div>
                </div>

                <div class="card shadow-lg border-0 overflow-hidden">
                    <div id="calendar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Event Modal -->
    <div class="modal fade" id="eventModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title mb-0">
                        <i class="fas fa-calendar-plus me-2"></i>Add New Event
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="calendarEventForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Event Title *</label>
                                <input type="text" class="form-control" name="title" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Event Type</label>
                                <select class="form-select" name="event_type">
                                    <option value="Wedding">Wedding</option>
                                    <option value="Conference">Conference</option>
                                    <option value="Party">Party</option>
                                    <option value="Meeting">Meeting</option>
                                    <option value="Workshop">Workshop</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Start Date & Time *</label>
                                <input type="datetime-local" class="form-control" name="start" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">End Date & Time</label>
                                <input type="datetime-local" class="form-control" name="end">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Location</label>
                            <input type="text" class="form-control" name="location">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea class="form-control" name="description" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Budget</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" name="budget" step="0.01">
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Status</label>
                                <select class="form-select" name="status">
                                    <option value="upcoming">Upcoming</option>
                                    <option value="ongoing">Ongoing</option>
                                    <option value="completed">Completed</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveCalendarEvent()">
                        <i class="fas fa-save me-2"></i>Save Event
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Event Details Modal -->
    <div class="modal fade" id="eventDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title mb-0" id="eventTitle"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="eventDetailsBody">
                    <!-- Event details loaded here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-primary" onclick="editSelectedEvent()">
                        <i class="fas fa-edit me-2"></i>Edit
                    </button>
                    <button type="button" class="btn btn-danger" onclick="deleteSelectedEvent()">
                        <i class="fas fa-trash me-2"></i>Delete
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="script.js"></script>
    <script>
        let calendar;
        let selectedEvent = null;

        document.addEventListener('DOMContentLoaded', function() {
            initializeCalendar();
            loadUpcomingEvents();
        });

        function initializeCalendar() {
            const calendarEl = document.getElementById('calendar');
            
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: ''
                },
                events: getCalendarEvents(),
                eventClick: function(info) {
                    selectedEvent = info.event;
                    showEventDetails(info.event);
                },
                dateClick: function(info) {
                    document.querySelector('#calendarEventForm [name="start"]').value = info.dateStr;
                },
                editable: true,
                selectable: true,
                selectMirror: true,
                dayMaxEvents: 3,
                height: 'auto',
                eventDidMount: function(info) {
                    info.el.style.cursor = 'pointer';
                }
            });
            
            calendar.render();

            // View change buttons
            document.querySelectorAll('[data-view]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const view = this.getAttribute('data-view');
                    calendar.changeView(view);
                    document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        }

        function getCalendarEvents() {
            // Load from global events array or localStorage
            return events.map(event => ({
                id: 'event_' + event.id,
                title: event.name,
                start: event.date,
                extendedProps: {
                    venue: event.venue,
                    budget: event.budget,
                    status: event.status
                },
                backgroundColor: getEventColor(event.status),
                borderColor: getEventColor(event.status),
                textColor: 'white'
            }));
        }

        function getEventColor(status) {
            const colors = {
                'upcoming': '#17a2b8',
                'ongoing': '#ffc107',
                'completed': '#28a745'
            };
            return colors[status] || '#6c757d';
        }

        function loadUpcomingEvents() {
            const eventList = document.getElementById('eventList');
            const upcoming = events
                .filter(event => new Date(event.date) >= new Date())
                .slice(0, 5)
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            eventList.innerHTML = '';
            
            upcoming.forEach(event => {
                const spent = expenses.filter(e => e.event_id == event.id)
                                     .reduce((sum, e) => sum + e.amount, 0);
                
                eventList.innerHTML += `
                    <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center px-3 py-3" onclick="selectCalendarEvent(${event.id})">
                        <div>
                            <h6 class="mb-1">${event.name}</h6>
                            <small class="text-muted">
                                <i class="fas fa-calendar me-1"></i>${new Date(event.date).toLocaleDateString()}
                                ${event.venue ? `• ${event.venue}` : ''}
                            </small>
                        </div>
                        <div class="text-end">
                            <span class="badge bg-primary rounded-pill">${event.status}</span>
                        </div>
                    </a>
                `;
            });
        }

        function showEventDetails(event) {
            document.getElementById('eventTitle').textContent = event.title;
            document.getElementById('eventDetailsBody').innerHTML = `
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <strong>Date:</strong><br>
                        <span class="text-muted">${event.start ? new Date(event.start).toLocaleString() : 'N/A'}</span>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong>Venue:</strong><br>
                        <span class="text-muted">${event.extendedProps.venue || 'Not specified'}</span>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong>Budget:</strong><br>
                        <span class="text-primary fw-bold">${formatCurrency(event.extendedProps.budget || 0)}</span>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong>Status:</strong><br>
                        <span class="badge bg-${event.extendedProps.status === 'completed' ? 'success' : event.extendedProps.status === 'ongoing' ? 'warning' : 'info'}">
                            ${event.extendedProps.status}
                        </span>
                    </div>
                </div>
            `;
            new bootstrap.Modal(document.getElementById('eventDetailsModal')).show();
        }

        function saveCalendarEvent() {
            const form = document.getElementById('calendarEventForm');
            const formData = new FormData(form);
            
            const eventData = {
                id: events.length ? Math.max(...events.map(e => e.id)) + 1 : 1,
                name: formData.get('title'),
                date: formData.get('start').split('T')[0],
                venue: formData.get('location'),
                budget: parseFloat(formData.get('budget')) || 0,
                status: formData.get('status') || 'upcoming'
            };
            
            events.push(eventData);
            syncData();
            calendar.refetchEvents();
            loadUpcomingEvents();
            updateDashboard(); // Update global dashboard if on index.html
            
            bootstrap.Modal.getInstance(document.getElementById('eventModal')).hide();
            form.reset();
        }

        function selectCalendarEvent(id) {
            const event = events.find(e => e.id === id);
            if (event) {
                const calendarEvent = calendar.getEventById('event_' + id);
                if (calendarEvent) {
                    calendarEvent.click();
                }
            }
        }

        function editSelectedEvent() {
            if (selectedEvent) {
                const eventData = events.find(e => e.id == selectedEvent.id.split('_')[1]);
                if (eventData) {
                    // Populate form with event data
                    document.querySelector('#calendarEventForm [name="title"]').value = eventData.name;
                    document.querySelector('#calendarEventForm [name="start"]').value = eventData.date + 'T10:00';
                    document.querySelector('#calendarEventForm [name="location"]').value = eventData.venue;
                    document.querySelector('#calendarEventForm [name="budget"]').value = eventData.budget;
                    document.querySelector('#calendarEventForm [name="status"]').value = eventData.status;
                    
                    bootstrap.Modal.getInstance(document.getElementById('eventDetailsModal')).hide();
                    new bootstrap.Modal(document.getElementById('eventModal')).show();
                }
            }
        }

        function deleteSelectedEvent() {
            if (selectedEvent && confirm('Are you sure you want to delete this event?')) {
                const eventId = selectedEvent.id.split('_')[1];
                events = events.filter(e => e.id != eventId);
                selectedEvent.remove();
                syncData();
                loadUpcomingEvents();
                bootstrap.Modal.getInstance(document.getElementById('eventDetailsModal')).hide();
            }
        }
    </script>
</body>
</html>
